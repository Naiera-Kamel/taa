 prog(8);
 var h="",i,j,n=0;
 for(i=0;i<P.length;i++){for(j=0;j<P[i].length;j++){h+='<span class="w tapw" id="r'+n+'">'+P[i][j]+'</span> ';n++;}h+='<span class="nl"></span>';}
 $("card").innerHTML='<div class="big">📖</div><div class="rule">اقْرَئِي الْقِصَّةَ بِصَوْتٍ عَالٍ، وَاُنْقُرِي عَلَى كُلِّ كَلِمَةٍ بَعْدَ قِرَاءَتِهَا.</div><div class="sent">'+h+'</div><button id="go">جَاهِزَةٌ لِلْأَسْئِلَةِ ✅</button>';
 var k;for(k=0;k<n;k++){(function(e){e.onclick=function(){e.className="w tapw on";};})($("r"+k));}
 $("go").onclick=function(){idx=0;di=0;miss=0;score=0;ask();};
}
function ask(){
 if(idx>=Q.length){dict();return;}
 prog(12+idx*68/Q.length);lock=false;upd(true);
 var q=Q[idx],k,h;
 h='<span class="badge">'+q.g+' • '+(idx+1)+' / '+Q.length+'</span>';
 if(q.t==="mc"){
  var o="";for(k=0;k<q.o.length;k++){o+='<button data-i="'+k+'">'+q.o[k]+'</button>';}
  $("card").innerHTML=h+'<div class="sent">'+sentHtml(q.s,q.w,false)+'</div><div class="q">'+q.q+'</div><div class="opts" id="opts">'+o+'</div><div class="msg" id="m"></div><div id="nx"></div>';
  var bs=$("opts").getElementsByTagName("button");
  for(k=0;k<bs.length;k++){(function(b){b.onclick=function(){
   if(lock){return;}
   if(parseInt(b.getAttribute("data-i"),10)===q.a){done(b);}
   else{b.className="no";miss++;lose();$("m").innerHTML="فَكِّرِي مَرَّةً أُخْرَى 💪";}
  };})(bs[k]);}
 }else{
  $("card").innerHTML=h+'<div class="q">'+q.q+'</div><div class="sent">'+sentHtml(q.s,-1,true)+'</div><div class="msg" id="m"></div><div id="nx"></div>';
  for(k=0;k<P[q.s].length;k++){(function(e,i2){e.onclick=function(){
   if(lock){return;}
   if(q.k.indexOf(i2)>-1){e.className="w tapw ok";done(null);}
   else{e.className="w tapw no";miss++;lose();$("m").innerHTML="فَكِّرِي مَرَّةً أُخْرَى 💪";}
  };})($("w"+k),k);}
 }
}
function done(b){
 lock=true;score++;upd(true);
 if(b){b.className="ok";}
 $("m").innerHTML="🌟 أَحْسَنْتِ!";
 $("nx").innerHTML='<div class="why">💡 '+Q[idx].y+'</div><button id="n">التَّالِي ◀</button>';
 $("n").onclick=function(){idx++;ask();};
}
function dict(){
 prog(85);upd(true);shown=false;
 var full=D.join(". ");
 var warn=(!canSpeak()||!hasAr())?'<div class="warn">⚠️ جِهَازُكِ قَدْ لَا يَدْعَمُ الصَّوْتَ الْعَرَبِيَّ. يُمْكِنُكِ أَنْ يُمْلِيَ عَلَيْكِ أَحَدٌ الْجُمْلَتَيْنِ، ثُمَّ تَكْتُبِينَهُمَا.</div>':"";
 $("card").innerHTML='<span class="badge">الْإِمْلَاءُ 🎧</span>'+
 '<div class="rule">اسْتَمِعِي إِلَى الْجُمْلَتَيْنِ الْمُتَرَابِطَتَيْنِ، ثُمَّ اكْتُبِيهِمَا كَمَا سَمِعْتِ (لَا تَحْتَاجِينَ إِلَى كِتَابَةِ الْحَرَكَاتِ).</div>'+warn+
 '<button class="speak" id="p1">🔊</button><br><button class="alt" id="p2">🐢 اسْتَمِعِي بِبُطْءٍ</button>'+
 '<textarea id="tx" rows="3" lang="ar" dir="rtl" placeholder="اُكْتُبِي هُنَا..."></textarea>'+
 '<button id="ck">تَحَقَّقِي ✅</button><div id="res"></div><div><span class="rv" id="rv">الصَّوْتُ لَا يَعْمَلُ؟ اُظْهِرِي الْجُمْلَتَيْنِ (بِدُونِ دَرَجَةٍ)</span></div>';
 $("p1").onclick=function(){say(full,0.7);};
 $("p2").onclick=function(){say(full,0.45);};
 $("rv").onclick=function(){shown=true;$("res").innerHTML='<div class="sent" style="font-size:26px">'+D.join(". ")+'</div>';};
 $("ck").onclick=check;
 setTimeout(function(){say(full,0.7);},400);
}
function check(){
 var t=$("tx").value;
 if(norm(t)===""){$("res").innerHTML='<div class="msg">اُكْتُبِي الْجُمْلَتَيْنِ أَوَّلًا ✏️</div>';return;}
 var ex=[],sid=[],good=[],i,j,w,h="",pts=0;
 for(i=0;i<D.length;i++){good[i]=true;w=norm(D[i]).split(" ");for(j=0;j<w.length;j++){ex.push(w[j]);sid.push(i);}}
 var us=norm(t).split(" ");
 for(i=0;i<ex.length;i++){if(us[i]!==ex[i]){good[sid[i]]=false;}}
 if(us.length!==ex.length){for(i=0;i<D.length;i++){good[i]=false;}}
 for(i=0;i<us.length;i++){h+='<span class="'+(us[i]===ex[i]?'good':'bad')+'">'+us[i]+'</span> ';}
 if(!shown){for(i=0;i<D.length;i++){if(good[i]){pts++;}}}
 score+=pts;upd(true);
 var m;
 if(shown){m='<div class="warn">أَظْهَرْتِ الْجُمْلَتَيْنِ قَبْلَ التَّحَقُّقِ فَلَا دَرَجَةَ هَذِهِ الْمَرَّةَ 🙂<br>الْجُمْلَتَانِ:<br><span style="font-size:26px">'+D.join(". ")+'</span></div>';}
 else if(pts===D.length){m='<div class="why">🌟 أَحْسَنْتِ! كَتَبْتِ الْجُمْلَتَيْنِ صَحِيحَتَيْنِ (+'+pts+')</div>';}
 else{m='<div class="warn">'+(pts>0?'جُمْلَةٌ وَاحِدَةٌ صَحِيحَةٌ (+'+pts+')، وَالْأُخْرَى تَحْتَاجُ مُرَاجَعَةً.<br>':'')+'كِتَابَتُكِ: '+h+'<br>الصَّحِيحُ:<br><span style="font-size:26px">'+D.join(". ")+'</span><br>اِنْتَبِهِي إِلَى الْكَلِمَاتِ الْحَمْرَاءِ.</div>';}
 $("ck").style.display="none";$("rv").style.display="none";
 $("res").innerHTML=m+'<button id="n2">النَّتِيجَةُ 🏆</button>';
 $("n2").onclick=end;
}
function end(){
 prog(100);upd(false);
 var r=score/TOT,n=r>=0.85?3:(r>=0.55?2:1),st="",k,msg,nb="";
 msg=r>=0.85?"مُمْتَازَةٌ! أَنْتِ بَطَلَةٌ حَقِيقِيَّةٌ 🌟":(r>=0.55?"جَيِّدٌ جِدًّا! حَاوِلِي الْوُصُولَ إِلَى "+TOT+" 💪":"بِدَايَةٌ جَمِيلَةٌ! أَعِيدِي وَسَتَصِلِينَ إِلَى "+TOT+" 💪");
 if(best>=0&&score>best){nb='<div class="rule">🎉 دَرَجَةٌ أَفْضَلُ مِنْ دَرَجَتِكِ السَّابِقَةِ ('+best+')!</div>';}
 else if(best>=0){nb='<div class="rule">أَفْضَلُ دَرَجَةٍ لَكِ حَتَّى الْآنَ: '+best+'</div>';}
 if(score>best){best=score;}
 for(k=0;k<3;k++){st+=k<n?"⭐":"☆";}
 $("card").innerHTML='<div class="big">🏆</div><h2>أَحْسَنْتِ!</h2><div class="stars">'+st+'</div><div class="big" style="color:#5a189a">'+score+' / '+TOT+'</div><div class="rule">'+msg+'</div>'+nb+
 '<button id="re">🔁 نُعِيدُ التَّدْرِيبَ</button><button class="alt" id="rd">📖 نَقْرَأُ الْقِصَّةَ</button>';
 $("re").onclick=function(){idx=0;di=0;miss=0;score=0;ask();};$("rd").onclick=reading;
}
try{if(canSpeak()){window.speechSynthesis.getVoices();}}catch(e){}
intro();
})();
</script></body></html>
